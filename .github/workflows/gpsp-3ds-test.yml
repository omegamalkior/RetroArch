name: gpSP 3DS test build

on:
  push:
    branches: [gpsp-arm-speedups-3ds-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: original-azahar
            patch: 0
            azahar: 1
          - name: patched-azahar
            patch: 1
            azahar: 1
          - name: patched-3ds
            patch: 1
            azahar: 0
    steps:
    - uses: actions/checkout@v4

    - name: Build (${{ matrix.name }})
      run: |
        cat > build.sh <<'SCRIPT'
        set -e
        git config --global --add safe.directory '*'
        git clone https://github.com/libretro/gpsp.git /tmp/gpsp
        cd /tmp/gpsp
        git checkout 5819380
        if [ "$PATCH" = "1" ]; then
          git apply /w/.github/gpsp-test/gpsp-arm-dynarec-speedups.patch
        fi
        if [ "$AZAHAR" = "1" ]; then
          python3 /w/.github/gpsp-test/azahar_variant.py .
        fi
        git diff --stat
        make platform=ctr CTRULIB="$DEVKITPRO/libctru" -j$(getconf _NPROCESSORS_ONLN)
        cp gpsp_libretro_ctr.a /w/libretro_ctr.a
        cd /w
        if [ "$AZAHAR" = "1" ]; then
          EXTRA="GPSP_AZAHAR_TEST=1 GPSP_TEST_VARIANT=$NAME APP_USE_SVCHAX=0"
        else
          EXTRA=""
        fi
        make -f Makefile.ctr -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 LIBRETRO=gpsp $EXTRA
        mkdir -p out
        cp retroarch_3ds.3dsx out/gpsp_$NAME.3dsx
        cp retroarch_3ds.cia out/gpsp_$NAME.cia
        ls -la out
        SCRIPT
        docker run --rm --user root -v "$PWD:/w" -w /w \
          -e PATCH=${{ matrix.patch }} -e AZAHAR=${{ matrix.azahar }} -e NAME=${{ matrix.name }} \
          reallibretroretroarch/libretro-build-devkitpro:latest bash /w/build.sh

    - uses: actions/upload-artifact@v4
      with:
        name: gpsp-${{ matrix.name }}
        path: out/

  # Test-only transport: artifact storage isn't reachable from where the
  # builds get tested, so put them on a throwaway orphan branch.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: builds
        merge-multiple: true
    - name: Push builds to the gpsp-3ds-test-builds branch
      run: |
        cd builds
        ls -la
        git init -q
        git config user.name "gpsp test build"
        git config user.email "noreply@github.com"
        git checkout -q --orphan gpsp-3ds-test-builds
        git add -A
        git commit -q -m "gpSP 3DS test builds from ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gpsp-3ds-test-builds
