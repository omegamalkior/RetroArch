name: PCSX ReARMed 3DS test build

on:
  push:
    branches: [pcsx-rearmed-3ds-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  PCSX_SHA: 7b0e8f8fadfbce3d170d195b9d9eecaabfa08c8e
  # what the test job does this time
  RUN_TIMING: 1
  RUN_PROFILE: 0
  PROFILE_ONLY: p_balls p_n00bdemo p_fpscam

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Get PS1 homebrew test programs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build >/dev/null
        bash .github/pcsx-test/get_content.sh
    - uses: actions/upload-artifact@v4
      with:
        name: content
        path: content/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: original-azahar, patches: '', kind: azahar }
          - { name: lit-azahar, patches: lit, kind: azahar }
          - { name: mask-azahar, patches: mask, kind: azahar }
          - { name: poly-azahar, patches: poly, kind: azahar }
          - { name: all-azahar, patches: all, kind: azahar }
          - { name: original-hw, patches: '', kind: hw, id: '0xBC150' }
          - { name: lit-hw, patches: lit, kind: hw, id: '0xBC151' }
          - { name: mask-hw, patches: mask, kind: hw, id: '0xBC152' }
          - { name: poly-hw, patches: poly, kind: hw, id: '0xBC153' }
          - { name: all-hw, patches: all, kind: hw, id: '0xBC154' }
          - { name: all-3ds, patches: all, kind: release }
    steps:
    - uses: actions/checkout@v4
    - name: Build (${{ matrix.name }})
      run: |
        cat > build.sh <<'SCRIPT'
        set -e
        git config --global --add safe.directory '*'
        git init -q /tmp/pcsx && cd /tmp/pcsx
        git remote add origin https://github.com/libretro/pcsx_rearmed.git
        git fetch -q --depth 1 origin "$PCSX_SHA" && git checkout -q FETCH_HEAD
        if [ -n "$PATCHES" ]; then
          for p in /w/.github/pcsx-test/patches/$PATCHES/*.patch; do git apply -v "$p"; done
        fi
        if [ "$KIND" = "azahar" ]; then
          python3 /w/.github/pcsx-test/azahar_variant.py .
        fi
        git diff --stat
        make -f Makefile.libretro platform=ctr -j$(getconf _NPROCESSORS_ONLN)
        cp pcsx_rearmed_libretro_ctr.a /w/libretro_ctr.a
        cd /w
        mkdir -p out
        case "$KIND" in
          azahar) EXTRA="GPSP_AZAHAR_TEST=1 GPSP_TEST_VARIANT=$NAME APP_USE_SVCHAX=0" ;;
          hw) EXTRA="HW_TIMING=1 GPSP_TEST_VARIANT=$NAME APP_UNIQUE_ID=$ID APP_PRODUCT_CODE=RARCH-PCSXT${ID: -1} APP_TITLE=PCSX-timing-$NAME" ;;
          *) EXTRA="" ;;
        esac
        make -f Makefile.ctr -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 LIBRETRO=pcsx_rearmed $EXTRA
        cp retroarch_3ds.3dsx out/pcsx_$NAME.3dsx
        cp retroarch_3ds.cia out/pcsx_$NAME.cia
        ls -la out
        SCRIPT
        docker run --rm --user root -v "$PWD:/w" -w /w \
          -e PATCHES=${{ matrix.patches }} -e KIND=${{ matrix.kind }} -e NAME=${{ matrix.name }} -e ID=${{ matrix.id }} -e PCSX_SHA \
          reallibretroretroarch/libretro-build-devkitpro:latest bash /w/build.sh
    - uses: actions/upload-artifact@v4
      with:
        name: pcsx-${{ matrix.name }}
        path: out/

  test:
    needs: [content, build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [original-azahar, lit-azahar, mask-azahar, poly-azahar, all-azahar]
        tag: ['', -sync]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: dl
    - name: Get Azahar
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
          libxcb-xinerama0 libegl1 libgl1 libopengl0 libpulse0 >/dev/null
        gh release download -R azahar-emu/azahar -p 'azahar.AppImage'
        chmod +x azahar.AppImage
        ./azahar.AppImage --appimage-extract >/dev/null
    - name: Run in Azahar
      run: |
        Xvfb :99 -screen 0 1280x720x24 &
        export DISPLAY=:99
        sleep 2
        v=${{ matrix.variant }}
        t='${{ matrix.tag }}'
        mkdir -p results
        if [ "$t" = "-sync" ]; then
          export CORE_OPTS="pcsx_rearmed_gpu_thread_rendering=disabled"
        fi
        if [ "$RUN_TIMING" = "1" ]; then
          python3 .github/pcsx-test/run_azahar.py squashfs-root/AppRun $v \
            dl/pcsx-$v/pcsx_$v.3dsx dl/content results "$t" || true
        fi
        if [ "$RUN_PROFILE" = "1" ] && [ -z "$t" ]; then
          PROFILE_SAMPLES=300 ONLY="$PROFILE_ONLY" python3 .github/pcsx-test/run_azahar.py \
            squashfs-root/AppRun $v dl/pcsx-$v/pcsx_$v.3dsx dl/content results -prof || true
          for d in results/$v-prof/*/; do
            [ -f "$d/samples.txt" ] || continue
            python3 .github/pcsx-test/profile_report.py dl/pcsx-$v/pcsx_$v.nm \
              "$d/samples.txt" "$d/retroarch.log" > "$d/profile.txt" || true
            echo "=== $d"; head -60 "$d/profile.txt"
          done
        fi
        cat results/summary_*.txt || true
        grep -h -A9 'PROF per-frame' results/*/*/retroarch.log /dev/null | sed 's/^\[libretro INFO\] //' || true
        for f in results/*/*/retroarch.log; do echo "== $f"; grep 'PROF' "$f" | sed 's/^\[libretro INFO\] //'; done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: results-${{ matrix.variant }}${{ matrix.tag }}
        path: results/

  compare:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: r
        pattern: results-*
        merge-multiple: true
    - name: Compare original and patched
      run: |
        for v in lit mask poly all; do
          for t in '' -sync; do
            echo "=== $v$t vs original$t" | tee -a r/compare.txt
            python3 .github/pcsx-test/compare_frames.py r original-azahar$t $v-azahar$t | tee -a r/compare.txt
          done
        done

  # Test-only transport: artifact storage isn't reachable from where the
  # builds get tested, so put them on a throwaway orphan branch.
  publish:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: pub
    - name: Push builds and results to the pcsx-3ds-test-builds branch
      run: |
        cd pub
        ls -R | head -100
        git init -q
        git config user.name "pcsx test build"
        git config user.email "noreply@github.com"
        git checkout -q --orphan pcsx-3ds-test-builds
        git add -A
        git commit -q -m "PCSX ReARMed 3DS test builds from ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" pcsx-3ds-test-builds
